name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/movie_mood

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: code/movie_mood/pom.xml

      - name: Build and run tests
        env:
          DB_URL: jdbc:h2:mem:moviemood;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
          DB_USERNAME: sa
          DB_PASSWORD: ''
          TMDB_API_TOKEN: ci-test-token
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: ci-test-secret
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          MAIL_USERNAME: ci@example.com
          MAIL_PASSWORD: ci-test-password
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: none
        run: mvn --batch-mode --no-transfer-progress clean verify
