spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.schemas=flyway_test_v2
spring.flyway.default-schema=flyway_test_v2
spring.flyway.locations=classpath:db/migration-test
spring.flyway.baseline-on-migrate=false
spring.flyway.create-schemas=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=flyway_test_v2
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false