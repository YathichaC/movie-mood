spring.application.name=movie_mood

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.token=${TMDB_API_TOKEN}
tmdb.http.connect-timeout-ms=5000
tmdb.http.read-timeout-ms=8000

spring.datasource.driver-class-name=org.postgresql.Driver
springdoc.swagger-ui.path=/swagger-ui.html

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false

supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SECRET_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:playlist-covers}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.prepareThreshold=0

app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=false