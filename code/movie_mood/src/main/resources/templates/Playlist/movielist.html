<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
    <title>MovieMood</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <style>
        body {
            background-color: #000000;
            color: #F5F5F5;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
        }
    </style>
</head>

<body
    class="bg-black text-[#F5F5F5] min-h-screen flex flex-col antialiased selection:bg-neutral-800 selection:text-white">
    <header th:replace="~{fragments/navbar :: navbar('playlist')}"></header>
    <main class="flex-1 w-full max-w-[1440px] mx-auto px-6 lg:px-12 py-10 flex flex-col gap-10">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 pb-8 border-b border-[#262626]">
            <div class="flex items-center gap-6">
                <img alt="Collage poster 1" class="w-[200px] h-[200px] object-cover"
                    src="https://i.pinimg.com/1200x/cf/c9/4a/cfc94ad7e5884ffae2d3a22b48ff1289.jpg">
                <div class="flex flex-col justify-center gap-1.5">
                    <span class="text-[11px] tracking-widest text-[#737373] uppercase">PLAYLIST</span>
                    <h1 class="text-3xl lg:text-4xl font-medium text-[#F5F5F5] tracking-tight">Whispers of the Wild</h1>
                    <p class="text-sm text-[#A3A3A3] tracking-wide">5 movies</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button
                    class="inline-flex items-center gap-2 px-4 py-2 border border-[#262626] bg-[#0A0A0A] hover:bg-[#141414] hover:border-neutral-500 text-xs uppercase tracking-widest text-[#F5F5F5] transition-colors rounded-sm"
                    onclick="openModal('deleteModal')" type="button">
                    Delete Playlist
                </button>
                <button
                    class="inline-flex items-center gap-2 px-4 py-2 bg-[#F5F5F5] hover:bg-white text-black text-xs font-semibold uppercase tracking-widest transition-colors rounded-sm"
                    onclick="openModal('editModal')" type="button">
                    Edit Playlist
                </button>
            </div>
        </div>
        <div class="flex items-center justify-between border-b border-[#262626] pb-3">
            <div class="flex items-center gap-3">
                <h2 class="text-2xl font-light text-[#F5F5F5] tracking-tight">Movies</h2>
            </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
            <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Resident Evil','https://image.tmdb.org/t/p/w1280/i7UyjfPio0VFHB9rBUZSFyhOoM8.jpg',7.3,2026)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Deadpool & Wolverine','https://image.tmdb.org/t/p/w1280/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg',7.6,2024)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Oppenheimer','https://image.tmdb.org/t/p/w1280/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg',8.0,2023)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Backrooms','https://image.tmdb.org/t/p/w1280/rhGx6E3qRNMgj3i5su2oukNHwIQ.jpg',7.0,2026)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Dune: Part Two','https://image.tmdb.org/t/p/w1280/6izwz7rsy95ARzTR3poZ8H6c5pp.jpg',8.1,2024)}">
                </div>
        </div>
    </main>
    <div th:replace="~{fragments/edit-playlist-modal :: edit-playlist-modal}"></div>
    <div th:replace="~{fragments/delete-playlist-modal :: delete-playlist-modal}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/playlist.js}"></script>
</body>

</html>
