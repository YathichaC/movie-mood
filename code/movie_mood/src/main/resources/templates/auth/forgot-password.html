<!DOCTYPE html>

<html lang="en" class="dark h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMood - Forgot Password</title>
    <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>
<body class="min-h-screen flex flex-col justify-center items-center px-6 py-12 bg-black selection:bg-[#B8A58A] selection:text-black">
    <header class="mb-10 text-center">
        <a th:href="@{/auth/login}" class="block font-['Outfit'] text-sm font-medium tracking-[0.25em] text-[#F5F5F5] uppercase leading-none hover:text-[#B8A58A] transition-colors duration-150">MOVIEMOOD</a>
    </header>
    <main class="w-full max-w-[380px] flex flex-col">
        <div class="mb-8">
            <h1 class="font-['Outfit'] text-[28px] md:text-[28px] leading-tight font-light tracking-[-0.015em] text-[#F5F5F5] mb-2">Forgot your password?</h1>
            <p class="text-sm font-normal text-[#A3A3A3] leading-relaxed">Enter the email address associated with your account and we'll send you instructions to reset your password.</p>
        </div>
        <form id="reset-request-form" class="space-y-6">
            <div class="space-y-2">
                <label for="email" class="block text-xs font-medium tracking-wide uppercase text-[#A3A3A3]">Email address</label>
                <input type="email" id="email" name="email" required autocomplete="email" autofocus placeholder="Enter your email address" class="w-full px-3.5 py-3 rounded-none bg-[#0A0A0A] border border-[#262626] text-[#F5F5F5] placeholder-[#737373] text-sm focus:outline-none focus:border-[#B8A58A] transition-colors duration-150">
            </div>
            <div class="hidden p-3.5 bg-[#0A0A0A] border border-[#B8A58A]/40 text-[#F5F5F5] items-center gap-3" id="status-toast">
                <p class="text-sm text-[#F5F5F5]">Verification link sent. Please check your email.</p>
            </div>
            <button type="submit" class="w-full py-3 px-4 rounded-none bg-white text-black font-['Outfit'] text-xs font-semibold tracking-wider uppercase hover:bg-[#F0F0F0] active:bg-[#E5E5E5] disabled:bg-[#737373] disabled:text-[#262626] focus:outline-none focus:ring-1 focus:ring-white transition-all duration-150 cursor-pointer">Send Reset Instructions</button>
        </form>
        <div class="mt-8 text-center">
            <a th:href="@{/auth/login}" class="text-xs font-medium text-[#D4D4D4] hover:text-white transition-colors duration-150 tracking-wide">← Back to Login</a>
        </div>
    </main>
    <script th:src="@{/js/forgot-password.js}"></script>
</body>
</html>
