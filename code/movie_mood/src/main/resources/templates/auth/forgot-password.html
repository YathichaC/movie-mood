<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>MovieMood</title>
    <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>

<body class="bg-background text-on-surface font-body-md min-h-screen
           flex flex-col justify-between
           selection:bg-primary-container
           selection:text-on-primary-container
           antialiased overflow-x-hidden">

    <!-- Header -->
    <header th:replace="fragments/header :: header"></header>


    <!-- Main -->
    <main class="relative z-10
                 flex-grow
                 flex items-center
                 justify-center
                 px-4
                 py-8
                 md:py-12">

        <div class="w-full max-w-[500px] relative">

            <!-- Main Card -->
            <div class="relative p-8 md:p-10">

                <!-- Lock Icon -->
                <div class="flex justify-center mb-6">

                    <div class="relative
                                flex items-center
                                justify-center
                                w-16 h-16
                                rounded-xl
                                bg-surface-container-high
                                border border-outline-variant/40
                                shadow-inner
                                group">

                        <div class="absolute inset-0
                                    rounded-xl
                                    bg-primary-container/10
                                    blur-sm">
                        </div>

                        <span class="material-symbols-outlined
                                     text-primary
                                     text-3xl
                                     relative z-10
                                     transition-transform
                                     duration-300
                                     group-hover:scale-110">
                            lock_reset
                        </span>

                    </div>

                </div>


                <!-- Header Text -->
                <div class="text-center
                            space-y-2
                            mb-5">

                    <h1 class="font-headline-lg
                               text-headline-lg
                               text-on-surface
                               tracking-tight">
                        Forgot Password?
                    </h1>

                    <p class="font-body-md
                              text-body-md
                              text-on-surface-variant
                              max-w-sm
                              mx-auto
                              leading-relaxed">

                        Enter the email associated with your
                        MovieMood account and we'll send you
                        a secure verification link to reset
                        your password.

                    </p>

                </div>


                <!-- Form -->
                <form class="space-y-6" id="reset-request-form">

                    <!-- Email -->
                    <div class="space-y-2">

                        <div class="flex justify-between items-center">

                            <label class="block
                                          font-label-lg
                                          text-label-lg
                                          text-on-surface" for="email">

                                Email Address

                            </label>

                        </div>


                        <div class="relative flex items-center">

                            <div class="absolute left-3.5
                                        flex items-center
                                        pointer-events-none
                                        text-on-surface-variant">

                                <span class="material-symbols-outlined text-xl">
                                    mail
                                </span>

                            </div>

                            <input autofocus class="w-full
                                       pl-11 pr-4
                                       py-3
                                       bg-surface-container-lowest/80
                                       border border-outline-variant/40
                                       rounded-lg
                                       text-on-surface
                                       placeholder:text-on-surface-variant/50
                                       font-body-md
                                       text-body-md
                                       focus:outline-none
                                       focus:border-primary-container
                                       focus:ring-1
                                       focus:ring-primary-container
                                       transition-all duration-200" id="email" name="email"
                                placeholder="example@email.com" required type="email">

                        </div>


                        <!-- Security Info -->
                        <div class="flex items-start
                                    gap-2
                                    pt-1
                                    text-on-surface-variant/90">

                        </div>

                    </div>


                    <!-- Status Toast -->
                    <div class="hidden
                                p-3.5
                                rounded-lg
                                bg-surface-container
                                border border-primary-container/40
                                text-on-surface
                                flex items-center
                                gap-3" id="status-toast">

                        <span class="material-symbols-outlined
                                     text-primary
                                     text-xl">

                            mark_email_read

                        </span>

                        <p class="font-body-sm
                                  text-body-sm
                                  text-on-surface">

                            Verification link sent.
                            Please check your email.

                        </p>

                    </div>


                    <!-- Submit -->
                    <button class="w-full
                               py-3.5
                               px-6
                               rounded-lg
                               bg-primary-container
                               hover:bg-primary-fixed
                               text-on-primary-container
                               font-label-lg
                               text-label-lg
                               font-bold
                               flex items-center
                               justify-center
                               gap-2
                               transition-all
                               duration-200
                               amber-btn-glow
                               active:scale-[0.98]
                               focus:outline-none
                               focus-visible:ring-2
                               focus-visible:ring-offset-2
                               focus-visible:ring-primary-container" type="submit">

                        <span>
                            Send Reset Link
                        </span>

                        <span class="material-symbols-outlined text-lg">
                            arrow_forward
                        </span>

                    </button>


                    <!-- Back to Login -->
                    <div class="flex justify-center pt-2">

                        <a th:href="@{/auth/login}" class="flex items-center
                                  gap-2
                                  text-on-surface-variant
                                  hover:text-primary
                                  transition-colors duration-200
                                  font-label-lg
                                  text-label-lg">

                            <span class="material-symbols-outlined text-sm">
                                arrow_back
                            </span>

                            <span>
                                Back to Login
                            </span>

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer th:replace="fragments/footer :: footer"></footer>


    <!-- JavaScript -->
    <script src="../../static/js/forgot-password.js"></script>

</body>

</html>
