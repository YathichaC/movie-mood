<!DOCTYPE html>

<html class="dark" lang="en" style="">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>MovieMood</title>
  <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script th:src="@{/js/tailwind-config.js}"></script>
</head>

<body
  class="bg-surface text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container relative overflow-x-hidden">
  <header th:replace="fragments/header :: header"></header>
  <main class="flex-1 flex items-center justify-center px-4 sm:px-6 md:px-8 py-8 sm:py-12 relative z-10">
    <div class="w-full max-w-md flex flex-col items-center text-center">
      <h1 class="font-headline-lg text-headline-lg md:text-headline-xl font-bold text-on-surface tracking-tight mb-3">
        Check Your Email
      </h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant max-w-md leading-relaxed mb-6">
        We have dispatched a secure password recovery link to your MovieMood account.
      </p>
      <div
        class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-highest/40 border border-outline-variant/30 shadow-inner mb-6 transition-colors duration-200">
        <span
          class="font-label-lg text-label-lg text-primary font-semibold tracking-wide select-all">alex.rivera@cinema.io</span>
        <button
          class="text-on-surface-variant hover:text-on-surface transition-colors duration-150 ml-1 p-0.5 rounded focus:outline-none"
          onclick="navigator.clipboard.writeText('alex.rivera@cinema.io')" title="Copy email address" type="button">
          <span class="material-symbols-outlined text-[15px]">content_copy</span>
        </button>
      </div>
      <div class="w-full space-y-3.5">
        <div
          class="flex flex-col sm:flex-row items-center justify-center gap-2 pt-2 text-center font-body-sm text-body-sm text-on-surface-variant">
          <span>Didn't receive the email? Check spam or</span>
          <div class="inline-flex items-center gap-1.5">
            <button
              class="font-label-md text-label-md text-primary font-semibold transition-all duration-200 hover:underline flex items-center gap-1 focus:outline-none opacity-60 cursor-not-allowed"
              id="resend-btn" disabled="">
              <span id="resend-text">Resend email in <span id="countdown">0</span>s</span>
            </button>
          </div>
        </div>
      </div>
      <div class="w-full h-px bg-outline-variant/20 my-6"></div>
      <a th:href="@{/auth/login}"
        class="inline-flex items-center justify-center gap-2 text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors duration-200 group">
        <span
          class="material-symbols-outlined text-[16px] transition-transform duration-200 group-hover:-translate-x-0.5">arrow_back</span>
        <span>Back to Login</span>
      </a>
    </div>
  </main>
  <div
    class="fixed bottom-6 right-6 z-50 transform transition-all duration-300 flex items-center gap-3 bg-surface-container-high border-l-4 border-primary-container p-4 rounded-lg shadow-2xl backdrop-blur-md translate-y-24 opacity-0 pointer-events-none"
    id="toast">
    <span class="material-symbols-outlined text-primary text-[22px] fill-icon">check_circle</span>
    <div>
      <p class="font-label-md text-label-md text-on-surface font-semibold">New Recovery Link Dispatched</p>
      <p class="font-body-sm text-body-sm text-on-surface-variant">Check your inbox for the updated MovieMood reset
        instructions.</p>
    </div>
  </div>
  <footer th:replace="fragments/footer :: footer"></footer>
  <script th:src="@{/js/password-email.js}"></script>
</body>

</html>
