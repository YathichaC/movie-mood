<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>MovieMood</title>
    <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>

<body class="bg-background text-on-surface font-body-md min-h-screen
           flex flex-col justify-between
           selection:bg-primary-container
           selection:text-on-primary-container
           antialiased overflow-x-hidden">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-1
               w-full
               max-w-[1600px]
               mx-auto
               px-4 md:px-12
               py-4 md:py-8
               flex items-center justify-center
               z-10 relative">

        <div class="w-full
                   grid grid-cols-1 md:grid-cols-12
                   gap-6 md:gap-12
                   items-center">

            <div class="hidden md:flex
                       md:col-span-6
                       xl:col-span-7
                       flex-col justify-between
                       h-[500px] xl:h-[680px]
                       rounded-xl
                       overflow-hidden
                       relative
                       border border-outline-variant/30
                       p-6 md:p-10
                       bg-surface-container-lowest/90">

                <div class="absolute inset-0
                           bg-cover bg-center
                           scale-105
                           transition-transform
                           duration-1000
                           ease-out
                           hover:scale-100" th:style="|background-image: url('@{/img/watching-movie.jpg}');|"
                    style="background-image: url('../../static/img/watching-movie.jpg');">
                </div>

                <div class="absolute inset-0
                           bg-gradient-to-t
                           from-surface-container-lowest
                           via-surface-container-lowest/60
                           to-transparent">
                </div>

                <div class="absolute inset-0
                           bg-gradient-to-r
                           from-surface-container-lowest/80
                           via-transparent
                           to-surface-container-lowest/80">
                </div>

                <div class="relative z-10 mt-auto">

                    <h2 class="font-headline-lg
                               text-headline-lg
                               font-bold
                               text-on-surface
                               tracking-tight
                               mb-3
                               leading-tight
                               text-2xl md:text-3xl">
                        Discover films tuned to your
                        <span class="text-primary-container
                                   drop-shadow-sm">
                            exact mood
                        </span>.
                    </h2>

                </div>

            </div>

            <div class="col-span-1
                       md:col-span-6
                       xl:col-span-5
                       w-full
                       flex flex-col
                       items-center">

                <div class="w-full
                           max-w-md
                           bg-surface-container-low/95
                           border border-outline-variant/40
                           rounded-xl
                           p-5 md:p-8
                           backdrop-blur-2xl
                           ambient-card-glow
                           relative">

                    <div class="text-center
                               md:text-left
                               mb-6">

                        <h1 class="font-headline-lg
                                   text-headline-lg
                                   font-bold
                                   text-on-surface
                                   mb-2">
                            Welcome back
                        </h1>

                        <p class="font-body-md
                                   text-body-md
                                   text-on-surface-variant">
                            Sign in to access your mood-based recommendations,
                            personalized watchlist, and watch history.
                        </p>

                    </div>

                    <form class="space-y-4" id="loginForm">

                        <div>

                            <label class="block
                                       font-label-md
                                       text-label-md
                                       text-on-surface
                                       mb-1.5" for="email">
                                Email address
                            </label>

                            <div class="relative flex items-center">

                                <span class="material-symbols-outlined
                                           absolute left-3.5
                                           text-on-surface-variant
                                           text-[20px]
                                           pointer-events-none">
                                    mail
                                </span>

                                <input class="w-full
                                           pl-11 pr-4
                                           py-3 md:py-2.5
                                           bg-surface-container
                                           border border-outline-variant/50
                                           rounded-lg
                                           text-on-surface
                                           placeholder:text-on-surface-variant/60
                                           font-body-md
                                           text-body-md
                                           focus:outline-none
                                           focus:border-primary
                                           focus:ring-1
                                           focus:ring-primary
                                           transition-all duration-150" id="email" name="email"
                                    placeholder="example@domain.com" required type="email">

                            </div>

                        </div>

                        <div>

                            <div class="flex items-center justify-between
                                       mb-1.5">

                                <label class="block
                                           font-label-md
                                           text-label-md
                                           text-on-surface" for="password">
                                    Password
                                </label>

                                <a class="font-label-sm
                                           text-label-sm
                                           text-primary
                                           hover:underline
                                           hover:text-primary-fixed
                                           transition-colors" th:href="@{/auth/forgot-password}">
                                    Forgot password?
                                </a>

                            </div>

                            <div class="relative flex items-center">

                                <span class="material-symbols-outlined
                                           absolute left-3.5
                                           text-on-surface-variant
                                           text-[20px]
                                           pointer-events-none">
                                    lock
                                </span>

                                <input class="w-full
                                           pl-11 pr-11
                                           py-3 md:py-2.5
                                           bg-surface-container
                                           border border-outline-variant/50
                                           rounded-lg
                                           text-on-surface
                                           placeholder:text-on-surface-variant/60
                                           font-body-md
                                           text-body-md
                                           focus:outline-none
                                           focus:border-primary
                                           focus:ring-1
                                           focus:ring-primary
                                           transition-all duration-150" id="password" name="password"
                                    placeholder="••••••••••••" required type="password">

                                <button aria-label="Toggle password visibility" class="absolute right-3
                                           text-on-surface-variant
                                           hover:text-on-surface
                                           transition-colors
                                           p-1" id="togglePassword" type="button">

                                    <span class="material-symbols-outlined
                                               text-[20px]" id="toggleIcon">
                                        visibility
                                    </span>

                                </button>

                            </div>

                        </div>

                        <button class="w-full
                                   mt-2
                                   py-3 px-4
                                   min-h-[48px]
                                   rounded-xl
                                   bg-primary-container
                                   hover:bg-primary-fixed-dim
                                   text-on-primary-container
                                   font-headline-sm
                                   text-headline-sm
                                   font-bold
                                   flex items-center justify-center
                                   gap-2
                                   transition-all duration-200
                                   transform
                                   hover:scale-[1.01]
                                   active:scale-[0.98]
                                   custom-amber-glow" id="submitBtn" type="submit">

                            <span>
                                Sign In
                            </span>

                            <span class="material-symbols-outlined
                                       text-[20px]">
                                arrow_forward
                            </span>

                        </button>

                    </form>

                    <div class="relative
                               my-6
                               flex items-center
                               justify-center">

                        <div class="w-full
                                   border-t
                                   border-outline-variant/30">
                        </div>

                        <span class="absolute
                                   bg-surface-container-low
                                   px-3
                                   font-label-sm
                                   text-label-sm
                                   text-on-surface-variant
                                   uppercase
                                   tracking-wider">
                            or
                        </span>

                    </div>

                    <div class="text-center">

                        <p class="font-body-md
                                   text-body-md
                                   text-on-surface-variant">

                            Don't have an account?

                            <a class="font-label-lg
                                       text-label-lg
                                       text-primary
                                       hover:text-primary-fixed
                                       font-bold
                                       underline
                                       decoration-primary/40
                                       underline-offset-4
                                       hover:decoration-primary
                                       transition-colors
                                       duration-200
                                       ml-1" th:href="@{/auth/register}">
                                Create an account
                            </a>

                        </p>

                    </div>

                    <div class="mt-6
                               pt-5
                               border-t
                               border-outline-variant/30
                               flex items-center
                               justify-center
                               gap-2
                               text-on-surface-variant">
                    </div>

                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div class="fixed
               bottom-4 md:bottom-6
               left-4 md:left-auto
               right-4 md:right-6
               z-50
               transform
               translate-y-24
               opacity-0
               transition-all duration-300
               pointer-events-none" id="toast">

        <div class="bg-surface-container-high
                   border-l-4
                   border-primary-container
                   text-on-surface
                   px-4 py-3
                   rounded-lg
                   shadow-2xl
                   flex items-center
                   gap-3
                   w-full md:max-w-sm">

            <span class="material-symbols-outlined
                       text-primary-container
                       text-[22px]" id="toastIcon">
                check_circle
            </span>

            <div>

                <p class="font-label-md
                           text-label-md
                           font-bold" id="toastTitle">
                    Signing in...
                </p>

            </div>

        </div>

    </div>

    <script src="../../static/js/login.js" th:src="@{/js/login.js}"></script>

</body>

</html>
