<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>MovieMood</title>
    <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>

<body
    class="bg-[#000000] text-[#F5F5F5] min-h-screen flex flex-col selection:bg-[#B8A58A] selection:text-[#000000] antialiased overflow-x-hidden">
    <footer th:replace="~{fragments/header :: header}"></footer>
    <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 md:px-12 py-8 flex items-center justify-center">
        <div class="w-full flex items-center justify-center">
            <section class="w-full max-w-[380px] flex flex-col items-center">
                <div class="w-full">
                    <div class="mb-6">
                        <span class="block font-['Outfit'] text-xs uppercase tracking-[0.18em] text-[#A3A3A3] mb-2">YOUR
                            PERSONAL CINEMA</span>
                        <h1
                            class="font-['Outfit'] text-[34px] leading-tight font-light tracking-tight text-[#F5F5F5] mb-2">
                            Create an account.</h1>
                        <p class="font-['Manrope'] text-sm leading-6 text-[#A3A3A3]">A better way to discover your next
                            film.</p>
                    </div>
                    <div class="w-full h-px bg-[#262626] mb-6"></div>
                    <form class="space-y-4" id="registerForm">
                        <div>
                            <label
                                class="block font-['Manrope'] text-[11px] font-semibold uppercase tracking-[0.12em] text-[#A3A3A3] mb-2"
                                for="username">USERNAME</label>
                            <input autocomplete="username"
                                class="w-full h-[46px] bg-[#0A0A0A] border border-[#262626] rounded text-[#F5F5F5] placeholder:text-[#737373] px-3.5 text-sm focus:outline-none focus:border-[#B8A58A] focus:ring-0 transition-colors"
                                id="username" name="username" placeholder="Enter your username" required type="text">
                        </div>
                        <div>
                            <label
                                class="block font-['Manrope'] text-[11px] font-semibold uppercase tracking-[0.12em] text-[#A3A3A3] mb-2"
                                for="email">EMAIL ADDRESS</label>
                            <input autocomplete="email"
                                class="w-full h-[46px] bg-[#0A0A0A] border border-[#262626] rounded text-[#F5F5F5] placeholder:text-[#737373] px-3.5 text-sm focus:outline-none focus:border-[#B8A58A] focus:ring-0 transition-colors"
                                id="email" name="email" placeholder="Enter your email" required type="email">
                        </div>
                        <div>
                            <label
                                class="block font-['Manrope'] text-[11px] font-semibold uppercase tracking-[0.12em] text-[#A3A3A3] mb-2"
                                for="password">PASSWORD</label>
                            <div class="relative flex items-center">
                                <input autocomplete="new-password"
                                    class="w-full h-[46px] bg-[#0A0A0A] border border-[#262626] rounded text-[#F5F5F5] placeholder:text-[#737373] pl-3.5 pr-12 text-sm focus:outline-none focus:border-[#B8A58A] focus:ring-0 transition-colors"
                                    id="password" name="password" placeholder="Enter your password" required
                                    type="password">
                                <button aria-label="Toggle password visibility"
                                    class="absolute right-3 flex items-center justify-center text-[#737373] hover:text-[#F5F5F5] transition-colors focus:outline-none"
                                    id="togglePassword" type="button">
                                    <span class="material-symbols-outlined text-[20px]"
                                        id="toggleIcon">visibility</span>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label
                                class="block font-['Manrope'] text-[11px] font-semibold uppercase tracking-[0.12em] text-[#A3A3A3] mb-2"
                                for="confirmPassword">CONFIRM PASSWORD</label>
                            <div class="relative flex items-center">
                                <input autocomplete="new-password"
                                    class="w-full h-[46px] bg-[#0A0A0A] border border-[#262626] rounded text-[#F5F5F5] placeholder:text-[#737373] pl-3.5 pr-12 text-sm focus:outline-none focus:border-[#B8A58A] focus:ring-0 transition-colors"
                                    id="confirmPassword" name="confirmPassword" placeholder="Confirm your password"
                                    required type="password">
                                <button aria-label="Toggle confirm password visibility"
                                    class="absolute right-3 flex items-center justify-center text-[#737373] hover:text-[#F5F5F5] transition-colors focus:outline-none"
                                    id="toggleConfirmPassword" type="button">
                                    <span class="material-symbols-outlined text-[20px]"
                                        id="toggleConfirmIcon">visibility</span>
                                </button>
                            </div>
                        </div>
                        <button
                            class="w-full h-[46px] mt-2 px-4 bg-white text-black font-['Outfit'] text-sm uppercase tracking-wider font-semibold rounded hover:bg-[#E8DCC9] active:bg-[#D8C4A7] disabled:bg-[#737373] disabled:text-[#262626] transition-colors flex items-center justify-center gap-2 focus:outline-none"
                            id="submitBtn" type="submit">
                            <span>Create Account</span>
                            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                        </button>
                    </form>
                    <div class="relative my-6 flex items-center justify-center">
                        <div class="w-full border-t border-[#262626]"></div>
                        <span
                            class="absolute bg-black px-3 font-['Manrope'] text-[11px] text-[#737373] uppercase tracking-widest">OR</span>
                    </div>
                    <div class="text-center">
                        <p class="font-['Manrope'] text-sm text-[#A3A3A3]">Already have an account? <a
                                class="inline-block ml-1 text-[#D4D4D4] hover:text-[#FFFFFF] underline underline-offset-4 decoration-[#262626] hover:decoration-[#FFFFFF] transition-colors"
                                th:href="@{/auth/login}">Sign in</a></p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div class="fixed bottom-4 md:bottom-6 left-4 md:left-auto right-4 md:right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none"
        id="toast">
        <div
            class="bg-[#1A1B18] border-l-4 border-[#B8A58A] text-[#F5F5F5] px-4 py-3 rounded shadow-2xl flex items-center gap-3 w-full md:max-w-sm">
            <span class="material-symbols-outlined text-[#B8A58A] text-[22px]" id="toastIcon">check_circle</span>
            <div>
                <p class="font-['Manrope'] text-sm font-semibold" id="toastTitle">Creating account...</p>
                <p class="font-['Manrope'] text-xs leading-5 text-[#A3A3A3]" id="toastMessage">Creating your MovieMood
                    account.</p>
            </div>
        </div>
    </div>
    <script th:src="@{/js/register.js}"></script>
</body>

</html>
