<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>MovieMood</title>
    <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

<body
    class="bg-background text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary">
    <header th:replace="~{fragments/navbar :: navbar('movies')}"></header>
    <main class="flex-grow w-full max-w-[1600px] mx-auto px-4 sm:px-6 md:px-12 py-8">
        <div class="flex flex-col lg:flex-row gap-8 items-start">
            <!-- Sidebar (Left) -->
            <aside class="w-full lg:w-80 shrink-0 flex flex-col gap-6 bg-surface-container-low/90 border border-outline-variant/30 rounded-xl p-6 backdrop-blur-md shadow-2xl">
                <div>
                    <!-- Search Bar -->
                    <form class="relative flex items-center w-full" onsubmit="event.preventDefault();">
                        <div class="relative w-full flex items-center">
                            <input
                                class="w-full pl-4 pr-10 py-3 bg-surface-container-lowest/90 border border-outline-variant/40 rounded-xl text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-inner"
                                id="searchInput" placeholder="Search..." type="text" value="">
                            <button class="absolute right-3 material-symbols-outlined text-xl text-on-surface-variant hover:text-primary transition-colors"
                                style="font-variation-settings: 'FILL' 1;">
                                search
                            </button>
                        </div>
                    </form>
                </div>

                <hr class="border-outline-variant/20">

                <!-- Sort By -->
                <div class="flex flex-col gap-2">
                    <label class="text-on-surface font-label-lg text-label-lg font-semibold flex items-center gap-1.5" for="sortSelector">
                        Sort by
                    </label>
                    <div class="relative">
                        <select
                            class="w-full appearance-none bg-surface-container-lowest border border-outline-variant/40 hover:border-primary text-on-surface text-label-md font-label-md rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:ring-1 focus:ring-primary transition-colors cursor-pointer"
                            id="sortSelector">
                            <option selected="">Highest rating</option>
                            <option>Alphabet A-Z</option>
                        </select>
                        <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px] pointer-events-none">
                            keyboard_arrow_down
                        </span>
                    </div>
                </div>

                <hr class="border-outline-variant/20">

                <!-- Rating Slider -->
                <div class="flex flex-col gap-2">
                    <div class="flex items-center justify-between">
                        <label class="text-on-surface font-label-lg text-label-lg font-semibold flex items-center gap-1.5">
                            Rating
                        </label>
                        <span id="ratingValue" class="text-primary font-label-md text-label-md font-bold">0+</span>
                    </div>
                    <input type="range" min="0" max="10" step="0.5" value="0" id="ratingSlider"
                        class="w-full accent-primary bg-surface-container-high h-2 rounded-lg cursor-pointer"
                        oninput="document.getElementById('ratingValue').textContent = this.value + '+'">
                </div>

                <hr class="border-outline-variant/20">

                <!-- Year Range Slider -->
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <label class="text-on-surface font-label-lg text-label-lg font-semibold flex items-center gap-1.5">
                            Year
                        </label>
                        <span id="yearValue" class="text-primary font-label-md text-label-md font-bold">1900 - 2026</span>
                    </div>
                    <div class="relative w-full h-6 flex items-center">
                        <div class="absolute w-full h-2 bg-surface-container-high rounded-lg pointer-events-none"></div>
                        <div id="yearTrack" class="absolute h-2 bg-primary rounded-lg pointer-events-none" style="left: 0%; right: 0%;"></div>
                        <input type="range" min="1900" max="2026" value="1900" id="yearStartSlider"
                            class="absolute w-full h-2 appearance-none bg-transparent pointer-events-none cursor-pointer accent-primary [&::-webkit-slider-thumb]:pointer-events-auto [&::-moz-range-thumb]:pointer-events-auto [&::-webkit-slider-runnable-track]:bg-transparent [&::-moz-range-track]:bg-transparent z-20"
                            oninput="updateYearSlider('start')">
                        <input type="range" min="1900" max="2026" value="2026" id="yearEndSlider"
                            class="absolute w-full h-2 appearance-none bg-transparent pointer-events-none cursor-pointer accent-primary [&::-webkit-slider-thumb]:pointer-events-auto [&::-moz-range-thumb]:pointer-events-auto [&::-webkit-slider-runnable-track]:bg-transparent [&::-moz-range-track]:bg-transparent z-10"
                            oninput="updateYearSlider('end')">
                    </div>
                </div>

                <hr class="border-outline-variant/20">

                <!-- Genre Checkboxes -->

                        Genre

                        </label>
                        <label class="flex items-center gap-2.5 text-on-surface-variant hover:text-on-surface text-label-md cursor-pointer">

                        <label class="flex items-center gap-2.5 text-on-surface-variant hover:text-on-surface text-label-md cursor-pointer">

                            <input type="checkbox" value="Drama" class="rounded border-outline-variant accent-primary w-4 h-4 cursor-pointer"> Drama
                        </label>
                        <label class="flex items-center gap-2.5 text-on-surface-variant hover:text-on-surface text-label-md cursor-pointer">
                            <input type="checkbox" value="Family" class="rounded border-outline-variant accent-primary w-4 h-4 cursor-pointer"> Family
                        </label>
                        <label class="flex items-center gap-2.5 text-on-surface-variant hover:text-on-surface text-label-md cursor-pointer">
                            <input type="checkbox" value="Fantasy" class="rounded border-outline-variant accent-primary w-4 h-4 cursor-pointer"> Fantasy

                        <label class="flex items-center gap-2.5 text-on-surface-variant hover:text-on-surface text-label-md cursor-pointer">

                        <label class="flex items-center gap-2.5 text-on-surface-variant hover:text-on-surface text-label-md cursor-pointer">
                            <input type="checkbox" value="Horror" class="rounded border-outline-variant accent-primary w-4 h-4 cursor-pointer"> Horror

                        <label class="flex items-center gap-2.5 text-on-surface-variant hover:text-on-surface text-label-md cursor-pointer">

                        <label class="flex items-center gap-2.5 text-on-surface-variant hover:text-on-surface text-label-md cursor-pointer">

    <script>
        function updateYearSlider(type) {
            const min = 1900, max = 2026;
            const startSlider = document.getElementById('yearStartSlider');
            const endSlider = document.getElementById('yearEndSlider');
            const yearValue = document.getElementById('yearValue');
            const yearTrack = document.getElementById('yearTrack');

            let start = parseInt(startSlider.value);
            let end = parseInt(endSlider.value);

            if (type === 'start' && start > end) {
                startSlider.value = end;
                start = end;
            } else if (type === 'end' && end < start) {
                endSlider.value = start;
                end = start;
            }

            if (yearValue) yearValue.textContent = start + ' - ' + end;
            if (yearTrack) {
                yearTrack.style.left = ((start - min) / (max - min) * 100) + '%';
                yearTrack.style.right = (100 - ((end - min) / (max - min) * 100)) + '%';
            }
        }
    </script>
