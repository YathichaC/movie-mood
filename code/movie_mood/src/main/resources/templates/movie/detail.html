<!DOCTYPE html>

<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMood</title>
    <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>

<body class="bg-cinema-bg text-cinema-main min-h-screen w-full overflow-x-hidden font-sans antialiased relative">
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <img id="detail-backdrop" src="" alt="" class="w-full h-full object-cover object-center scale-[1.01]">

        <div class="absolute inset-0 bg-black/60"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-black/10 via-black/20 to-black/45"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/35 via-transparent to-black/10"></div>
        <div class="absolute inset-0 film-grain opacity-40 mix-blend-overlay"></div>
    </div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <header th:replace="~{fragments/navbar :: navbar('movie')}"></header>
        <main class="w-full flex-1 flex items-center px-6 md:px-12 lg:px-16 py-10 md:py-12">
            <div
                class="w-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_minmax(0,1.05fr)] lg:grid-cols-[minmax(0,1.1fr)_minmax(0,1fr)] gap-10 lg:gap-16 items-center">
                <div class="flex justify-center md:justify-start items-center">
                    <div
                        class="w-full max-w-[360px] sm:max-w-[440px] lg:max-w-[520px] aspect-[2/3] overflow-hidden shadow-2xl shadow-black/40 border border-white/10">
                        <img id="detail-poster" src="" alt="" class="w-full h-full object-cover object-center">
                    </div>
                </div>

                <div class="w-full flex flex-col items-start md:max-w-[520px] md:justify-self-end">
                    <h1 id="detail-title"
                        class="font-display font-medium text-4xl sm:text-[44px] lg:text-[46px] leading-[1.08] tracking-[0.04em] text-white uppercase mb-5">
                        Loading...
                    </h1>
                    <div
                        class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-5 sm:mb-6 text-[13px] border-b border-white/20 pb-4 w-full">
                        <div class="flex items-baseline gap-1.5">
                            <span class="font-sans italic text-[13px] text-white/60">
                                Year
                            </span>
                            <span id="detail-year"
                                class="font-sans font-medium text-[13px] tracking-wider text-white uppercase">
                                —
                            </span>
                        </div>
                        <div class="flex items-baseline gap-1.5">
                            <span class="font-sans italic text-[13px] text-white/60">
                                Rating
                            </span>
                            <span id="detail-rating"
                                class="font-sans font-medium text-[13px] tracking-wider text-white uppercase">
                                —
                            </span>
                        </div>
                        <div class="flex items-baseline gap-1.5">
                            <span class="font-sans italic text-[13px] text-white/60">
                                Genres
                            </span>
                            <span id="detail-genres"
                                class="font-sans font-medium text-[13px] tracking-wider text-white uppercase">
                                —
                            </span>
                        </div>
                    </div>
                    <p id="detail-synopsis"
                        class="font-sans text-[14px] sm:text-[14.5px] leading-[1.75] text-white/85 font-normal tracking-wide max-w-[500px] mb-7 sm:mb-8">
                        Loading movie information...
                    </p>
                    <div class="w-full flex flex-col sm:flex-row flex-wrap items-stretch gap-2.5 sm:gap-3">
                        <button type="button" id="trailerActionBtn"
                            class="flex-1 min-w-[120px] h-[44px] md:h-[46px] px-3 flex items-center justify-center border border-white/50 text-white text-[11px] font-medium tracking-[0.1em] uppercase hover:bg-white hover:text-black hover:border-white transition-all duration-200 focus:outline-none whitespace-nowrap">
                            View Trailer
                        </button>

                        <button type="button" id="watchlistActionBtn"
                            class="flex-1 min-w-[120px] h-[44px] md:h-[46px] px-3 flex items-center justify-center border border-white/50 text-white text-[11px] font-medium tracking-[0.1em] uppercase hover:bg-white hover:text-black hover:border-white transition-all duration-200 focus:outline-none whitespace-nowrap">
                            Add to Playlist
                        </button>

                        <button type="button" id="watchedActionBtn"
                            class="flex-1 min-w-[120px] h-[44px] md:h-[46px] px-3 flex items-center justify-center border border-white/50 text-white text-[11px] font-medium tracking-[0.1em] uppercase hover:bg-white hover:text-black hover:border-white transition-all duration-200 focus:outline-none whitespace-nowrap">
                            Mark as Watched
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <div class="w-full h-8 md:h-10 pointer-events-none"></div>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
    <div th:replace="~{fragments/playlist-modal :: playlist-modal}"></div>
    <div th:replace="~{fragments/trailer-modal :: trailer-modal}"></div>
    <script th:src="@{/js/playlist.js}"></script>
    <script th:src="@{/js/trailer.js}"></script>
    <script th:src="@{/js/detail.js}"></script>
</body>


</html>
