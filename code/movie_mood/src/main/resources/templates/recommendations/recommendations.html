<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
    <title>MovieMood</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>

<body class="bg-[#000000] text-on-background font-['Outfit'] antialiased">
    <header th:replace="~{fragments/navbar :: navbar('recommendations')}"></header>
    <main class="min-h-screen px-6 py-16 md:px-10 lg:px-16">
        <section class="mx-auto flex max-w-7xl flex-col gap-8 md:flex-row md:items-end md:justify-between">
            <div>
                <h1 class="text-4xl font-light tracking-tight text-on-surface md:text-5xl lg:text-6xl">
                    Recommended for You
                </h1>
            </div>
            <button type="button" th:onclick="|window.location.href='@{/recommendations}'|"
                class="flex w-fit items-center gap-2 rounded-full border border-outline-variant px-5 py-3 text-sm font-medium text-on-surface transition hover:border-primary hover:text-primary">
                <span class="material-symbols-outlined text-[18px]">swap_horiz</span>
                Change Mood
            </button>
        </section>
        <section class="mx-auto mt-20 max-w-7xl">
            <div class="mb-8 flex items-center justify-between">
                <h2 class="text-2xl font-medium tracking-tight text-on-surface">Top 10 Movies</h2>
            </div>
            <div class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-5">
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('The Odyssey','https://image.tmdb.org/t/p/w1280/5rhTDKUhPYvpdQIijFIs5VoWsON.jpg',8.0,2026)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Resident Evil','https://image.tmdb.org/t/p/w1280/i7UyjfPio0VFHB9rBUZSFyhOoM8.jpg',7.3,2026)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Deadpool & Wolverine','https://image.tmdb.org/t/p/w1280/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg',7.6,2024)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Oppenheimer','https://image.tmdb.org/t/p/w1280/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg',8.0,2023)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Backrooms','https://image.tmdb.org/t/p/w1280/rhGx6E3qRNMgj3i5su2oukNHwIQ.jpg',7.0,2026)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Dune: Part Two','https://image.tmdb.org/t/p/w1280/6izwz7rsy95ARzTR3poZ8H6c5pp.jpg',8.1,2024)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Avengers: Endgame','https://image.tmdb.org/t/p/w1280/ulzhLuWrPK07P1YkdWQLZnQh1JL.jpg',8.2,2019)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Despicable Me','https://image.tmdb.org/t/p/w1280/b1BT309QWjtFUlJPLmXmrcHOWEL.jpg',7.2,2010)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('F1','https://image.tmdb.org/t/p/w1280/9PXZIUsSDh4alB80jheWX4fhZmy.jpg',7.8,2025)}">
                </div>
                <div
                    th:replace="~{fragments/home-movie-card :: home-movie-card('Titanic','https://image.tmdb.org/t/p/w1280/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg',7.9,1997)}">
                </div>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
