<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" type="image/png" th:href="@{/img/moviemood_logo.png}">
    <title>MovieMood</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
</head>

<body
    class="bg-[#000000] text-[#F5F5F5] font-manrope antialiased selection:bg-[#B8A58A] selection:text-[#000000] min-h-screen flex flex-col">
    <header th:replace="~{fragments/navbar :: navbar('home')}"></header>
    <main class="w-full flex-1">
        <section id="hero-movie" class="relative w-full min-h-[calc(100vh-80px)] overflow-hidden flex items-end">
            <img id="hero-backdrop" alt="" class="absolute inset-0 w-full h-full object-cover object-center">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-black/10 via-black/25 to-black/90"></div>
            <div class="relative z-10 w-full max-w-[1400px] mx-auto px-8 md:px-12 pb-16 md:pb-20 pt-32">
                <div class="max-w-4xl">
                    <div id="hero-meta"
                        class="font-manrope text-xs tracking-widest text-[#B8A58A] mb-3 uppercase font-medium">
                        Loading...
                    </div>
                    <h1 id="hero-title"
                        class="font-outfit text-5xl md:text-6xl lg:text-7xl font-light text-[#F5F5F5] tracking-tight mb-4 leading-[1.08]">
                        Loading movie...
                    </h1>
                    <p id="hero-synopsis" class="text-sm md:text-base text-[#D4D4D4] leading-relaxed max-w-3xl mb-8">
                        Loading movie information...
                    </p>
                    <div class="flex flex-wrap items-center gap-3">
                        <a id="hero-explore"
                            class="inline-flex items-center justify-center bg-white text-black hover:bg-[#E8DCC9] active:bg-[#D8C4A7] px-8 py-3.5 text-xs font-semibold tracking-widest uppercase transition-colors"
                            href="#">
                            Explore Movie
                        </a>
                        <button id="hero-trailer" type="button"
                            class="inline-flex items-center justify-center gap-2 border border-[#B8A58A] text-[#F5F5F5] hover:bg-[#B8A58A] hover:text-black px-8 py-3.5 text-xs font-semibold tracking-widest uppercase transition-colors">
                            <span class="material-symbols-outlined text-[18px]">
                                play_arrow
                            </span>
                            <span>Watch Trailer</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
        <section class="w-full max-w-[1400px] mx-auto px-8 md:px-12 py-16">
            <div class="flex items-center justify-between mb-8">
                <h2 class="font-outfit text-2xl font-light text-[#F5F5F5] tracking-tight">
                    Trending Movies
                </h2>

                <a class="font-manrope text-xs uppercase tracking-widest text-[#A3A3A3] hover:text-white transition-colors"
                    th:href="@{/movie/search}">
                    Explore More
                </a>
            </div>

            <div id="trending-movies" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-6">

                <div class="col-span-full py-16 text-center">
                    <span class="material-symbols-outlined text-4xl text-white/20">
                        movie
                    </span>

                    <p class="mt-3 text-sm text-white/40">
                        Loading movies...
                    </p>
                </div>

            </div>

            <div id="pagination-container" class="mt-10"></div>
        </section>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <div th:replace="~{fragments/trailer-modal :: trailer-modal}"></div>
    <script th:src="@{/js/home.js}"></script>
    <script th:src="@{/js/trailer.js}"></script>
</body>

</html>
