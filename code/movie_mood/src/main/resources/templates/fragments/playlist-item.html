<div th:fragment="playlist-item(name,count,checked)"
    class="flex items-center justify-between p-3 rounded-xl bg-surface-container-low/80 border border-outline-variant/30 hover:border-primary/40 cursor-pointer transition-colors group">
    <div class="flex items-center gap-3">
        <input type="checkbox" th:checked="${checked}"
            class="w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary/40 bg-surface-container-lowest cursor-pointer accent-amber-500">
        <div class="flex flex-col">
            <span data-playlist-name
                class="font-label-lg text-label-lg text-on-surface group-hover:text-primary transition-colors font-medium"
                th:text="${name}"></span>
            <span class="font-body-sm text-body-sm text-on-surface-variant"
                th:text="${count} + ' films'"></span>
        </div>
    </div>
</div>
