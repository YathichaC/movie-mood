<nav th:fragment="navbar(activePage)"
    class="w-full bg-[#000000] border-b border-[#262626] sticky top-0 z-40 h-20 flex-shrink-0">
    <div class="w-full max-w-[1400px] mx-auto px-8 md:px-12 h-full flex items-center justify-between">
        <div class="flex items-center gap-10">
            <a class="font-outfit font-medium text-lg tracking-[0.2em] text-[#F5F5F5] uppercase transition-colors hover:text-[#B8A58A] whitespace-nowrap"
                th:href="@{/home}">MOVIEMOOD</a>
            <nav class="hidden md:flex items-center gap-10">
                <a th:href="@{/home}"
                    th:classappend="${activePage == 'home' ? ' text-[#B8A58A] font-semibold' : ' text-[#D4D4D4] hover:text-[#FFFFFF]'}"
                    class="flex-1 text-center font-manrope text-[11px] uppercase tracking-[0.12em] py-2 transition-colors whitespace-nowrap">Home</a>
                <a th:href="@{/movie/search}"
                    th:classappend="${activePage == 'movies' ? ' text-[#B8A58A] font-semibold' : ' text-[#D4D4D4] hover:text-[#FFFFFF]'}"
                    class="flex-1 text-center font-manrope text-[11px] uppercase tracking-[0.12em] py-2 transition-colors whitespace-nowrap">Movies</a>
                <a th:href="@{/recommendations}"
                    th:classappend="${activePage == 'recommendations' ? ' text-[#B8A58A] font-semibold' : ' text-[#D4D4D4] hover:text-[#FFFFFF]'}"
                    class="flex-1 text-center font-manrope text-[11px] uppercase tracking-[0.12em] py-2 transition-colors whitespace-nowrap">Recommendations</a>
                <a th:href="@{/playlist}"
                    th:classappend="${activePage == 'playlist' ? ' text-[#B8A58A] font-semibold' : ' text-[#D4D4D4] hover:text-[#FFFFFF]'}"
                    class="flex-1 text-center font-manrope text-[11px] uppercase tracking-[0.12em] py-2 transition-colors whitespace-nowrap">Playlist</a>
                <a th:href="@{/history}"
                    th:classappend="${activePage == 'history' ? ' text-[#B8A58A] font-semibold' : ' text-[#D4D4D4] hover:text-[#FFFFFF]'}"
                    class="flex-1 text-center font-manrope text-[11px] uppercase tracking-[0.12em] py-2 transition-colors whitespace-nowrap">Watch
                    History</a>
            </nav>

        </div>
        <div class="flex items-center gap-6 h-full">
            <a th:href="@{/profile}"
                class="flex items-center justify-center h-10 min-w-[80px] font-manrope text-[11px] uppercase tracking-[0.12em] text-[#D4D4D4] hover:text-[#FFFFFF] transition-colors whitespace-nowrap">Account</a>
            
            <button id="nav-logout-btn"
                class="flex items-center justify-center h-10 min-w-[80px] font-manrope text-[11px] uppercase tracking-[0.12em] text-[#D4D4D4] hover:text-[#FFFFFF] transition-colors cursor-pointer bg-transparent border-0 p-0 whitespace-nowrap"
                type="button">Logout</button>
        </div>

    </div>

    
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const logoutBtn = document.getElementById("nav-logout-btn");
        if (!logoutBtn) return;

        logoutBtn.addEventListener("click", async (e) => {
            e.preventDefault();

            const token = localStorage.getItem("token");

            try {
                await fetch("/api/v1/auth/logout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        ...(token ? { "Authorization": `Bearer ${token}` } : {})
                    }
                });
            } catch (err) {
                console.error("Logout error:", err);
            } finally {
                localStorage.removeItem("token");
                localStorage.removeItem("userId");
                localStorage.removeItem("username");
                localStorage.removeItem("email");

                window.location.href = "/auth/login";
            }
        });
    });
</script>
</nav>
