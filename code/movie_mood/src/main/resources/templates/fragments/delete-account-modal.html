<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="delete-account-modal">
    <div aria-labelledby="modal-headline"
        aria-modal="true"
        class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-[#000000]/80 backdrop-blur-none transition-opacity duration-150 hidden opacity-0"
        id="delete-modal"
        role="dialog">
        <div class="max-w-md w-full bg-[#0E0E0E] border border-red-900/50 p-7 md:p-8 relative shadow-2xl">
            <button
                aria-label="Close modal"
                class="absolute top-6 right-6 text-[#737373] hover:text-[#FFFFFF] transition-colors"
                id="modal-close-icon"
                type="button">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
            <span
                class="text-[10px] tracking-widest uppercase border border-red-900/80 px-2 py-0.5 text-red-400 mb-4 inline-block font-semibold">
                Final Confirmation
            </span>
            <h3
                class="text-2xl font-bold tracking-tight text-[#F5F5F5] mb-2"
                id="modal-headline">
                Delete Account
            </h3>
            <p class="text-xs text-[#A3A3A3] leading-relaxed mb-6">
                This action cannot be undone. Type your username to confirm
                account deletion.
            </p>
            <form
                class="space-y-4 mb-6"
                id="delete-confirm-form"
                onsubmit="event.preventDefault();">
                <div>
                    <label
                        class="block text-xs uppercase tracking-wider text-[#A3A3A3] mb-1.5 font-medium"
                        for="modal-username">
                        Username
                    </label>
                    <input
                        autocomplete="off"
                        class="w-full bg-[#141414] border border-[#262626] focus:border-[#FFFFFF] focus:ring-0 text-[#F5F5F5] text-xs px-3.5 py-2.5 outline-none transition-colors"
                        id="modal-username"
                        placeholder="Type your username"
                        type="text">
                    <p
                        class="mt-1 text-[11px] text-[#737373]"
                        id="modal-user-hint">
                        Enter your username to confirm
                    </p>
                    <p
                        class="mt-1 text-[11px] text-red-400 hidden"
                        id="modal-error-msg">
                        Username does not match.
                    </p>
                </div>
            </form>
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#262626]">
                <button
                    class="border border-[#262626] text-[#A3A3A3] hover:text-[#FFFFFF] hover:border-[#525252] text-xs uppercase tracking-widest px-5 py-2.5 transition-colors"
                    id="modal-cancel-btn"
                    type="button">
                    Cancel
                </button>
                <button
                    class="bg-red-600 border border-red-500 text-[#FFFFFF] text-xs uppercase tracking-widest font-semibold px-5 py-2.5 transition-all opacity-40 cursor-not-allowed hover:bg-red-700"
                    disabled
                    id="modal-delete-confirm-btn"
                    type="button">
                    Delete Account
                </button>
            </div>
        </div>
    </div>
</div>
</html>
