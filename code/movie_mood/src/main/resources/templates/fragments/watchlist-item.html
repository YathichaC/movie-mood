<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="watchlist-item(title, poster, amount, playlistId)">
    <a th:href="@{/playlist/movielist(playlistId=${playlistId})}" class="block">
        <article class="group relative overflow-hidden rounded-2xl border border-white/[0.08] bg-[#101116] hover:border-white/[0.16] transition duration-300">
            <div class="relative aspect-[16/10] overflow-hidden bg-[#0b0c0f]">
                <img th:if="${poster != null and !#strings.isEmpty(poster)}"
                    th:src="${poster}"
                    th:alt="${title}"
                    class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:opacity-85 group-hover:scale-[1.03] transition duration-500">
                <div th:if="${poster == null or #strings.isEmpty(poster)}"
                    class="absolute inset-0 flex items-center justify-center text-white/20">
                    <span class="material-symbols-outlined text-5xl">movie</span>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#101116] via-transparent to-transparent"></div>
                <div class="absolute left-5 right-5 bottom-5 flex items-end justify-between gap-4">
                    <div class="min-w-0">
                        <h2 class="text-xl font-semibold truncate"
                            th:text="${title}">Playlist</h2>
                        <p class="text-xs text-white/45 mt-1"
                            th:text="${amount}">0 Movies</p>
                    </div>
                </div>
            </div>
        </article>
    </a>
</th:block>
</html>
