<a th:fragment="watchlist-item(title, poster)" th:href="@{/playlist/movielist}"
    class="group flex flex-col md:flex-row items-center gap-4 p-3.5 rounded-xl bg-surface-container border border-[#232D42] hover:border-primary/60 transition-all duration-200">
    <div
        class="relative w-20 h-20 rounded-lg overflow-hidden flex-shrink-0 bg-surface-container-highest border border-[#232D42]">
        <img class="w-full h-full object-cover" th:src="${poster}">
    </div>
    <div class="space-y-1">
        <h4 class="text-title-md font-title-md font-semibold text-on-surface group-hover:text-primary transition-colors"
            th:text="${title}">
            Movie Title
        </h4>
    </div>
</a>
