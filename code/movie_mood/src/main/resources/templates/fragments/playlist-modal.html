<div th:fragment="playlist-modal" id="playlistModal"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm transition-opacity duration-300 font-outfit antialiased"
    role="dialog" aria-modal="true" aria-labelledby="playlistModalTitle" style="display:none;">
    <div
        class="relative w-full max-w-[480px] max-h-[90vh] overflow-y-auto custom-scrollbar bg-[#0A0A0A] border border-[#262626] rounded-[10px] p-6 text-[#F5F5F5] shadow-2xl">
        <div class="flex items-start justify-between gap-4 border-b border-[#262626] pb-4 mb-4">
            <div>
                <h2 id="playlistModalTitle" class="text-[18px] leading-[1.4] font-medium tracking-tight text-[#F5F5F5]">
                    Add to Playlist</h2>
                <p class="mt-1 text-[12px] leading-[1.6] font-normal tracking-normal text-[#A1A1AA]">Select playlists
                    for <span class="font-medium text-[#F5F5F5]">Spider-Man: Brand New Day</span></p>
            </div>
            <button id="closePlaylistModal" type="button" aria-label="Close dialog"
                class="shrink-0 rounded p-1 -mr-1 text-[#A1A1AA] hover:text-white transition-colors focus:outline-none focus:ring-1 focus:ring-[#737373]">
                <span class="material-symbols-outlined block text-[20px] leading-none">close</span>
            </button>
        </div>
        <div class="relative mb-3.5">
            <span
                class="material-symbols-outlined absolute inset-y-0 left-3 flex items-center text-[17px] leading-none text-[#737373] pointer-events-none">search</span>
            <input id="searchPlaylistsInput" type="text" autocomplete="off" placeholder="Search your playlists..."
                class="w-full rounded-[6px] border border-[#262626] bg-[#0E0E0E] py-2 pl-9 pr-3 text-[13px] font-normal leading-[1.5] tracking-normal text-[#F5F5F5] placeholder:text-[#737373] transition-colors focus:outline-none focus:border-[#737373]">
        </div>
        <div id="playlistsList" class="custom-scrollbar max-h-[224px] overflow-y-auto divide-y divide-[#1A1A1A] pr-1">
            <div
                th:replace="~{fragments/playlist-item :: playlist-item(name='Cyberpunk & Deep Mind-Benders',count=8,checked=true)}">
            </div>
            <div
                th:replace="~{fragments/playlist-item :: playlist-item(name='Late Night Cosmic Sci-Fi',count=14,checked=true)}">
            </div>
            <div
                th:replace="~{fragments/playlist-item :: playlist-item(name='Mind-Bending Masterpieces',count=22,checked=false)}">
            </div>
            <div
                th:replace="~{fragments/playlist-item :: playlist-item(name='Weekend Watch Party',count=5,checked=false)}">
            </div>
        </div>
        <template id="playlistItemTemplate">
            <div th:replace="~{fragments/playlist-item :: playlist-item(name='',count=1,checked=true)}"></div>
        </template>
        <div class="border-t border-[#262626] pt-3.5 mt-2">
            <button id="toggleCreatePlaylistBtn" type="button"
                class="flex items-center gap-1.5 text-[11px] font-medium leading-[1.5] uppercase tracking-[0.08em] text-[#D4D4D4] transition-colors hover:text-white focus:outline-none">
                <span class="material-symbols-outlined text-[14px] leading-none">add</span>
                <span>Create New Playlist</span>
            </button>
            <div id="createPlaylistForm" class="hidden mt-2.5 flex items-center gap-2">
                <input id="newPlaylistNameInput" type="text" placeholder="Playlist name..."
                    class="min-w-0 flex-1 rounded-[4px] border border-[#262626] bg-black px-3 py-1.5 text-[12px] font-normal leading-[1.5] tracking-normal text-[#F5F5F5] placeholder:text-[#737373] focus:outline-none focus:border-[#737373]">
                <button id="confirmCreatePlaylistBtn" type="button"
                    class="rounded-[4px] border border-[#404040] bg-[#0A0A0A] px-3 py-1.5 text-[12px] font-medium leading-[1.5] tracking-normal text-[#F5F5F5] transition-colors hover:bg-[#1A1A1A]">Create</button>
            </div>
        </div>
        <div class="border-t border-[#262626] pt-4 mt-4 flex items-center justify-end gap-2.5">
            <button id="cancelPlaylistModal" type="button"
                class="rounded-[4px] px-4 py-2 text-[12px] font-medium leading-[1.5] tracking-normal text-[#A1A1AA] transition-colors hover:text-white focus:outline-none">Cancel</button>
            <button id="watchlistActionBtn" type="button"
                class="rounded-[4px] bg-white px-4 py-2 text-[12px] font-semibold leading-[1.5] tracking-wide text-black transition-colors hover:bg-[#F0F0F0] active:bg-[#E5E5E5] focus:outline-none">
                <span>Add to Playlists</span>
            </button>
        </div>
    </div>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0A0A0A
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 2px
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #404040
        }
    </style>
    <script th:src="@{/js/playlist.js}"></script>
</div>
