<a th:fragment="home-movie-card(title, poster, rating, year)" th:href="@{/movie/detail}" class="block cursor-pointer group">
    <article
        class="w-full relative rounded-xl overflow-hidden bg-surface-container-low border border-outline-variant/30 hover:border-primary transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-primary-container/10 flex flex-col">
        <div class="relative aspect-[2/3] w-full overflow-hidden bg-surface-dim">
            <img th:src="${poster}" th:alt="${title + ' movie poster'}"
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low via-transparent to-black/40"></div>
            <div class="absolute top-3 left-3 right-3 flex items-center justify-between">
                <div
                    class="flex items-center gap-1 px-2 py-0.5 rounded-md bg-surface-container-lowest/80 backdrop-blur-md border border-primary/40 text-primary">
                    <span class="material-symbols-outlined text-[14px]" data-weight="fill"
                        style="font-variation-settings: 'FILL' 1;">
                    </span>
                    <span class="font-label-sm text-label-sm font-bold" th:text="${rating}">
                    </span>
                </div>
                <span
                    class="px-2 py-0.5 rounded-md bg-surface-container-lowest/80 backdrop-blur-md font-label-sm text-label-sm text-on-surface-variant border border-outline-variant/30"
                    th:text="${year}">
                </span>
            </div>
        </div>
        <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
                <h3 class="font-title-md text-title-md text-on-surface font-semibold group-hover:text-primary transition-colors line-clamp-1"
                    th:text="${title}">
                </h3>
            </div>
        </div>
    </article>
</a>
