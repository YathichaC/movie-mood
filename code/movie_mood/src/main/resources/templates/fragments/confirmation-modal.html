
<div th:fragment="confirmation-modal" id="confirmation-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="confirmation-modal-title">
    <div id="confirmation-modal-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
    <div class="relative z-10 w-full max-w-md rounded-2xl bg-surface-container-low border border-outline-variant/40 shadow-2xl overflow-hidden">
        <div class="p-6 sm:p-7">
            <div id="confirmation-modal-icon-wrapper" class="w-12 h-12 rounded-full bg-red-500/10 flex items-center justify-center mb-5">
                <span id="confirmation-modal-icon" class="material-symbols-outlined text-red-500 text-3xl">delete</span>
            </div>
            <h2 id="confirmation-modal-title" class="text-xl font-bold text-on-surface mb-2">Confirm deletion</h2>
            <p id="confirmation-modal-message" class="text-sm leading-6 text-on-surface-variant">Are you sure you want to delete this item?</p>
        </div>
        <div class="flex items-center justify-end gap-3 px-6 py-4 bg-surface-container-high/50 border-t border-outline-variant/20">
            <button type="button" id="confirmation-modal-cancel" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-on-surface-variant hover:bg-surface-container-high transition-colors">Cancel</button>
            <button type="button" id="confirmation-modal-confirm" class="px-4 py-2.5 rounded-lg text-sm font-semibold bg-red-600 text-white hover:bg-red-700 transition-colors">Delete</button>
        </div>
    </div>
</div>
